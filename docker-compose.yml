version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - BATCH_REGISTRY_CONTRACT_ID=CDFARKBKLJYRLJTY7E7GV5HECEXRTSOVBUM2BFPLZQCF5FA3P3XOKDPD
      - CUSTODY_CHAIN_CONTRACT_ID=CB35ZOHKY7XS57NF4QJLHBZWSWU3PXNJH6ELELATV6U6UHIZUPV3CXVM
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - DATABASE_URL=sqlite:///app/data/pharma_indexer.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - NEXT_PUBLIC_BATCH_REGISTRY_CONTRACT_ID=CDFARKBKLJYRLJTY7E7GV5HECEXRTSOVBUM2BFPLZQCF5FA3P3XOKDPD
      - NEXT_PUBLIC_CUSTODY_CHAIN_CONTRACT_ID=CB35ZOHKY7XS57NF4QJLHBZWSWU3PXNJH6ELELATV6U6UHIZUPV3CXVM
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8080
      - NEXT_PUBLIC_BACKEND_WS_URL=ws://localhost:8080/ws
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
