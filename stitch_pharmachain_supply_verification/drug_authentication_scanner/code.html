<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-frame-animation {
            animation: scan-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes scan-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #316bf3, transparent);
            position: absolute;
            width: 100%;
            top: 0;
            animation: move-line 3s linear infinite;
        }
        @keyframes move-line {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .clinical-overlay {
            background: radial-gradient(circle, transparent 60%, rgba(11, 28, 48, 0.4) 100%);
        }
    </style>

<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center px-container-margin-mobile h-16">

<h1 class="font-headline-md text-headline-md-mobile font-bold text-secondary">PharmaTrust</h1>
</div>
<div class="flex items-center gap-md">
<button class="p-xs hover:bg-surface-variant transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content: Scanner Viewfinder -->
<main class="flex-1 relative mt-16 pb-20 overflow-hidden bg-black">
<!-- Camera Placeholder Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-60" data-alt="A macro close-up view of a high-end pharmaceutical medicine package, showing a crisp 2D Data Matrix barcode printed on a white matte surface. The lighting is clinical and bright, creating a professional medical laboratory atmosphere with cool blue tones and sharp focus. The depth of field is shallow, emphasizing the digital verification process in a modern corporate pharmaceutical setting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDndB_33CUiH_lTPy802G7s73yBbrulkQzHQkb6f-3SzFaAcYoD6gSscQ7YwTc6ljpqYWfba0kcJ8oNn-QZ0Pbf4OWhg7dEFg0aKwFSw9tThuYXp0bDtkuNoFyeGbiEZ3psIbDP6I3fRsrOoc1JLUJeVHTo0Ml9NUJfCUOXH_M-g6gK7MjOBFs0LkZonrbZVV8mj3fzUzqY331cqtmCm__iz7q-PFbUn0lcGR26Hj0miqlx3tuJf5Mh-bs_dCdglX56oqGRLbilTxg')"></div>
</div>
<!-- Scanning Overlay UI -->
<div class="absolute inset-0 z-10 clinical-overlay pointer-events-none"></div>
<!-- Viewfinder Frame -->
<div class="relative z-20 flex flex-col items-center justify-center h-full px-container-margin-mobile">
<div class="relative w-full max-w-xs aspect-square border-2 border-white/20 rounded-xl overflow-hidden shadow-2xl scanner-frame-animation">
<!-- Corner Indicators -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-secondary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-secondary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-secondary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-secondary rounded-br-xl"></div>
<!-- Animated Scan Line -->
<div class="scan-line"></div>
<!-- Target Reticle -->
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<div class="w-24 h-24 border border-white rounded-full"></div>
</div>
</div>
<!-- Contextual Controls & Instructions -->
<div class="mt-xl w-full flex flex-col items-center">
<div class="bg-surface-container-highest/90 backdrop-blur-md px-lg py-md rounded-xl text-center shadow-lg border border-outline-variant max-w-sm">
<p class="font-headline-md text-on-surface mb-xs">Scan Drug Package</p>
<p class="font-body-sm text-on-surface-variant">Align the unique batch ID within the frame to verify authenticity.</p>
</div>
<div class="mt-lg flex gap-lg">
<!-- Flashlight Toggle -->
<button class="group flex flex-col items-center gap-xs" id="flashlight-toggle">
<div class="w-14 h-14 bg-surface-container-lowest border border-outline-variant rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform hover:bg-surface-variant">
<span class="material-symbols-outlined text-secondary" data-icon="flashlight_on">flashlight_on</span>
</div>
<span class="font-label-caps text-on-surface text-white">Flashlight</span>
</button>
<!-- Manual Entry -->
<button class="group flex flex-col items-center gap-xs">
<div class="w-14 h-14 bg-surface-container-lowest border border-outline-variant rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform hover:bg-surface-variant">
<span class="material-symbols-outlined text-secondary" data-icon="keyboard">keyboard</span>
</div>
<span class="font-label-caps text-on-surface text-white">Manual ID</span>
</button>
</div>
</div>
</div>
<!-- Live Data Feed (Micro-interaction) -->
<div class="absolute bottom-8 left-0 w-full px-container-margin-mobile z-30 pointer-events-none">
<div class="bg-primary-container/80 backdrop-blur-sm text-on-primary-container p-sm rounded-lg flex items-center gap-sm max-w-fit mx-auto border border-outline-variant">
<span class="material-symbols-outlined text-xs" data-icon="sync">sync</span>
<span class="font-data-mono text-label-caps text-white">SYSTEM_STATUS: CAMERA_ACTIVE_WAITING_FOR_MARKER</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant flex justify-around items-center h-20 pb-safe px-4">

<span class="font-label-caps text-label-caps">Dashboard</span>
</a>

<span class="material-symbols-outlined" data-icon="account_tree">account_tree</span>
<span class="font-label-caps text-label-caps">Timeline</span>
</a>

<span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-caps text-label-caps">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
<span class="font-label-caps text-label-caps">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</a>
</nav>
<script>
        document.getElementById('flashlight-toggle').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            const isOff = icon.textContent === 'flashlight_off';
            icon.textContent = isOff ? 'flashlight_on' : 'flashlight_off';
            
            // Subtle feedback animation
            this.classList.add('scale-90');
            setTimeout(() => this.classList.remove('scale-90'), 100);
            
            // Atmospheric change
            const bgOverlay = document.querySelector('.bg-cover');
            if (isOff) {
                bgOverlay.classList.remove('opacity-40');
                bgOverlay.classList.add('opacity-60');
            } else {
                bgOverlay.classList.remove('opacity-60');
                bgOverlay.classList.add('opacity-40');
            }
        });

        // Simulated Scanning Micro-interaction
        let scanningProgress = 0;
        const scanLine = document.querySelector('.scan-line');
        const frame = document.querySelector('.scanner-frame-animation');

        setInterval(() => {
            scanningProgress += 1;
            if (scanningProgress > 100) scanningProgress = 0;
            
            // Randomly flash a corner to simulate focus locking
            if (Math.random() > 0.95) {
                const corners = document.querySelectorAll('.border-secondary');
                const randomCorner = corners[Math.floor(Math.random() * corners.length)];
                randomCorner.classList.add('brightness-150');
                setTimeout(() => randomCorner.classList.remove('brightness-150'), 300);
            }
        }, 100);
    </script>
</body></html>
