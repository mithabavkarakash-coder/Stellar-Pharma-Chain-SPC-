name: Stellar Pharma Chain CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smart-contracts:
    name: Smart Contracts Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Smart Contract Unit Tests
        run: cargo test --package pharma-types --package batch-registry --package custody-chain

      - name: Build Soroban WASM Binaries
        run: cargo build --target wasm32-unknown-unknown --release --package batch-registry --package custody-chain

  backend:
    name: Rust Backend & Indexer Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Backend Tests
        run: cargo test --package pharma-backend

  frontend:
    name: Next.js Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend Code
        run: cd frontend && npm run lint

      - name: Run Frontend Tests
        run: cd frontend && npm test -- --run

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_BATCH_REGISTRY_CONTRACT_ID: "CDFARKBKLJYRLJTY7E7GV5HECEXRTSOVBUM2BFPLZQCF5FA3P3XOKDPD"
          NEXT_PUBLIC_CUSTODY_CHAIN_CONTRACT_ID: "CB35ZOHKY7XS57NF4QJLHBZWSWU3PXNJH6ELELATV6U6UHIZUPV3CXVM"
        run: cd frontend && npm run build
